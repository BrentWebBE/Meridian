# Meridian workspace. Each desktop component is its own crate (added phase by phase).
[workspace]
resolver = "3"
members = [
    "meridian-common",
    "meridian-comp",
    "meridian-bar",
    "meridian-dock",
    "meridian-launcher",
    "meridian-notify",
    "meridian-settings",
    "meridian-desktop",
    "meridian-lock",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BrentWebBE/Meridian"

# Versions are declared once here; member crates say `foo.workspace = true`.
# Cargo.lock (committed) records the exact resolved versions, like package-lock.json.
[workspace.dependencies]
meridian-common = { path = "meridian-common" }
anyhow = "1.0.100"
# GTK 4 for the shell programs; `package` lets us write `gtk::` instead of `gtk4::`.
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
glib-unix = "0.22.8"
zbus = "6.5.0"
nucleo = "0.5.0"
inotify = "0.11.5"
# Lock screen: the session-lock protocol for GTK, PAM for the password check,
# and zeroize to wipe the password from memory.
gtk4-session-lock = "0.5.0"
pam-client = "0.5.0"
zeroize = "1.9.2"
async-channel = "2.5.0"
gtk4-layer-shell = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
toml_edit = "0.25.20"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
serde_json = "1.0.145"
png = "0.18.0"
# Drawing title bars in the compositor: cairo for shapes, pango for text.
cairo-rs = "0.22.11"
pango = "0.22.9"
pangocairo = "0.22.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
xcursor = "0.3.10"

# Smithay 0.7.0 on crates.io dates from June 2025; niri and cosmic-comp both track
# git master, so we pin an exact master commit instead.
[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "a38bb709a0400759b6a4fab6129e0f1dd72808c3"
default-features = false
features = [
    "backend_winit",           # nested: run inside a window
    "backend_udev",            # real session: find GPUs and monitors
    "backend_drm",             # ... drive monitors (KMS)
    "backend_gbm",             # ... allocate GPU buffers
    "backend_libinput",        # ... keyboards, mice, touchpads
    "backend_session_libseat", # ... get device access without root
    "backend_egl",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

# Helper from the Smithay repo that tracks which monitors are plugged in.
[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "a38bb709a0400759b6a4fab6129e0f1dd72808c3"
default-features = false

[profile.release]
lto = "thin"
