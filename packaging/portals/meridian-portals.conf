# Which xdg-desktop-portal backends a Terra (Meridian) session uses.
# Installed to /usr/share/xdg-desktop-portal/meridian-portals.conf and
# selected because the session sets XDG_CURRENT_DESKTOP=Meridian.
[preferred]
# File chooser, app chooser, print, settings (color scheme) and the rest:
# the GTK backend, which needs nothing from the compositor.
default=gtk
# Passwords: gnome-keyring.
org.freedesktop.impl.portal.Secret=gnome-keyring
# Screenshot and ScreenCast need a backend that can capture this
# compositor. None exists yet, so they are switched off rather than routed
# to a backend that would hang or fail.
org.freedesktop.impl.portal.Screenshot=none
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.RemoteDesktop=none
