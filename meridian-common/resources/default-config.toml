# Meridian configuration.
#
# Copy this file to ~/.config/meridian/config.toml and edit it.
# Anything you leave out keeps its default. Exception: if you write a
# [keybindings] section it replaces ALL default keybindings.

# Window layout at startup: "floating" or "tiled".
layout = "floating"

# Terminal for the "spawn-terminal" action.
# Empty = the first one installed of: foot, alacritty, kitty, ghostty.
terminal = ""

# Programs started together with Meridian. Set to [] for a bare compositor.
autostart = ["meridian-bar", "meridian-dock", "meridian-notify", "meridian-launcher --background"]

[appearance]
# "morning", "dusk" or "night". Ignored while follow-time-of-day is on.
theme = "morning"
# Morning from 6:00, dusk from 17:00, night from 21:00.
follow-time-of-day = true
# An image (PNG or JPEG) to use instead of the drawn landscape. Empty = none.
wallpaper = ""

[keyboard]
# XKB names, e.g. layout = "us", "be", "de". Empty = system default.
layout = ""
variant = ""
options = ""          # e.g. "caps:escape"
repeat-delay = 200    # ms before a held key starts repeating
repeat-rate = 25      # repeats per second

[output]
# Scale factor for HiDPI screens: 1, 2, 3. 0 = pick automatically.
# Fractional scaling is not supported yet.
scale = 0

[tiled]
gap = 12              # pixels between tiled windows
master-ratio = 0.55   # share of the width for the first window

[dock]
# "dock" = always visible, "auto-hide" = appears at the screen edge,
# "off" = no dock (use Find instead).
mode = "dock"
position = "bottom"       # "bottom", "left" or "right"
running-dots = true       # a dot under apps that are running
# Apps always shown in the dock, by desktop file id (the file name in
# /usr/share/applications without ".desktop"). Missing apps are skipped.
pinned = [
    "org.gnome.Nautilus",
    "firefox",
    "Alacritty",
    "foot",
    "org.gnome.TextEditor",
    "org.meridian.Settings",
]

# Keys are written as modifiers and one key joined by "+".
# Modifiers: Mod, Super, Alt, Ctrl, Shift.
# "Mod" is Super on a real session and Alt when Meridian runs inside a window.
# Key names are XKB keysym names (Return, Tab, space, a-z, F1, ...).
#
# Actions: "spawn-terminal", "close-window", "quit", "toggle-layout",
# "focus-next", "focus-previous", "screenshot", "toggle-overview", "focus-dock",
# { workspace = 2 }, { move-to-workspace = 2 }, { spawn = "command with args" }.

[keybindings]
"Mod+Return" = "spawn-terminal"
"Mod+Q" = "close-window"
"Mod+Shift+E" = "quit"
"Mod+T" = "toggle-layout"
"Mod+Tab" = "focus-next"
"Mod+Shift+Tab" = "focus-previous"
"Print" = "screenshot"
# Find is a single program: starting it again closes it.
# In a real session, tapping the Super key on its own opens it too.
"Mod+space" = { spawn = "meridian-launcher" }
"Mod+O" = "toggle-overview"
"Mod+D" = "focus-dock"
"Mod+1" = { workspace = 1 }
"Mod+2" = { workspace = 2 }
"Mod+3" = { workspace = 3 }
"Mod+4" = { workspace = 4 }
"Mod+Shift+1" = { move-to-workspace = 1 }
"Mod+Shift+2" = { move-to-workspace = 2 }
"Mod+Shift+3" = { move-to-workspace = 3 }
"Mod+Shift+4" = { move-to-workspace = 4 }
